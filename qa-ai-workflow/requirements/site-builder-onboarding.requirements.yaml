requirements:
  - id: "REQ-BUILDER-001"
    title: "Creator can repeat a section over live catalog data"
    description: "The site editor must let a creator add a Collection element that repeats an item template once per item from a chosen live catalog source."
    prd_section: "Issue #35 Mechanic; Issue #37 Goal"
    source_issues:
      - "#35"
      - "#37"
    priority: "should"
    type: "functional"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "The editor provides a Collection element or equivalent repeated-section control."
      - "The creator can choose a supported source such as riffables, riffs, or articles."
      - "The editor preview repeats the template for catalog items."
      - "The published site renders one card or section instance per item."
    assumptions:
      - "This closed issue is tracked as regression baseline."
    open_questions:
      - "Which live catalog sources are currently supported in the editor?"
    related_requirements:
      - "REQ-BUILDER-002"

  - id: "REQ-BUILDER-002"
    title: "Fields inside repeated cards can bind to the current item"
    description: "Content fields inside a repeated card must be able to pull from the current item instead of using fixed static values."
    prd_section: "Issue #35 Acceptance criteria; Issue #38 Goal"
    source_issues:
      - "#35"
      - "#38"
    priority: "should"
    type: "functional"
    status: "draft"
    acceptance_criteria:
      - "Text fields can be bound to fields of the current item."
      - "Image src and alt fields can be bound to fields of the current item."
      - "Button labels can be bound to fields of the current item."
      - "Static and bound values are visually or structurally distinguishable in the editor."
      - "Editor preview and published site resolve bindings consistently."
    assumptions: []
    open_questions:
      - "What field types are supported for binding in the current editor?"
    related_requirements:
      - "REQ-BUILDER-001"

  - id: "REQ-BUILDER-003"
    title: "Inspector Data tab explains the binding workflow"
    description: "The inspector Data tab must guide creators through the binding workflow and show only genuinely bindable sources."
    prd_section: "Issue #35 Acceptance criteria; Issue #39 Goal"
    source_issues:
      - "#35"
      - "#39"
    priority: "should"
    type: "ui"
    status: "draft"
    acceptance_criteria:
      - "The Data tab explains the add Collection, pick source, link field workflow."
      - "The Data tab lists only real bindable sources."
      - "The Data tab includes riffables, riffs, and articles if those are the supported sources."
      - "The Data tab does not show misleading non-bindable manifest keys."
    assumptions: []
    open_questions:
      - "Should the Data tab include examples or only concise guidance?"
    related_requirements:
      - "REQ-BUILDER-002"

  - id: "REQ-BUILDER-004"
    title: "Selecting a section in layers scrolls the editor canvas to it"
    description: "When the creator selects a section from the editor layers list, the canvas must scroll to bring that section into view."
    prd_section: "Issue #35 Mechanic; Issue #40 Goal"
    source_issues:
      - "#35"
      - "#40"
    priority: "should"
    type: "ui"
    status: "draft"
    acceptance_criteria:
      - "Selecting an off-screen section from the layers list scrolls the canvas."
      - "The selected section becomes visible after the action."
      - "The scroll behavior does not lose the current selection."
      - "The behavior works on long pages."
    assumptions: []
    open_questions:
      - "Should the scroll be smooth or instant for test expectations?"
    related_requirements: []

  - id: "REQ-BUILDER-005"
    title: "Publish dialog uses a fixed tenant subdomain format"
    description: "The publish dialog must save public site hosts using a fixed platform-owned suffix with only the tenant subdomain editable."
    prd_section: "Issue #44 Goal; Issue #44 Example of done"
    source_issues:
      - "#44"
    priority: "must"
    type: "business-rule"
    status: "draft"
    acceptance_criteria:
      - "The publish dialog shows a host in the format subdomain plus fixed suffix."
      - "The suffix is read-only and environment-configured."
      - "The subdomain is prefilled from the tenant slug."
      - "Invalid subdomain characters are sanitized or rejected."
      - "The saved host is always a valid subdomain under the fixed suffix."
    assumptions:
      - "Custom domains are out of scope."
    open_questions:
      - "What exact suffix is used in QA and production?"
    related_requirements:
      - "REQ-PUBLIC-001"

  - id: "REQ-ONBOARD-001"
    title: "Main console screens provide first-visit guided tours"
    description: "Home, Sources, Content, and Sites screens must each provide a short guided tour for new creators."
    prd_section: "Issue #36 Mechanic; Issue #41 Goal"
    source_issues:
      - "#36"
      - "#41"
    priority: "could"
    type: "ui"
    status: "draft"
    acceptance_criteria:
      - "Each main console screen has its own step sequence."
      - "A screen tour auto-starts once per creator on first visit."
      - "Closing early counts as seen so the tour does not repeatedly nag."
      - "A persistent help control can replay the current screen tour."
      - "Tour steps include Back, Next, and progress affordances."
    assumptions:
      - "This closed issue is tracked as regression baseline."
    open_questions:
      - "Where is tour-seen state persisted?"
    related_requirements:
      - "REQ-ONBOARD-002"

  - id: "REQ-ONBOARD-002"
    title: "Site editor provides its own guided tour"
    description: "The site editor must provide a first-visit guided tour that introduces the editor chrome and major regions."
    prd_section: "Issue #36 Out of scope; Issue #43 Goal"
    source_issues:
      - "#36"
      - "#43"
    priority: "could"
    type: "ui"
    status: "draft"
    acceptance_criteria:
      - "Opening the editor for the first time starts an editor tour."
      - "The tour introduces add or arrange panel, live canvas, inspector, Preview, and Publish."
      - "The canvas iframe is highlighted as a region without requiring per-section iframe targeting."
      - "The editor help button can replay the tour."
      - "Completion is remembered per creator."
    assumptions:
      - "Individual sections inside the canvas iframe are out of scope."
    open_questions:
      - "Should editor tour state share storage with main screen tours?"
    related_requirements:
      - "REQ-ONBOARD-001"

  - id: "REQ-BUILDER-006"
    title: "Site editor Assistant proposes previewable diffs for natural-language public-site edits"
    description: "The site editor Assistant must let an operator request supported public-site edits in natural language and respond with a previewable diff that can be accepted or rejected before it mutates the site."
    prd_section: "Issue #66 Goal; Issue #66 expected Assistant behavior"
    source_issues:
      - "#66"
    priority: "must"
    type: "ai-assisted-functional"
    status: "draft"
    acceptance_criteria:
      - "The Assistant accepts a natural-language edit request from the site editor."
      - "For supported edits, the Assistant proposes a structured diff rather than silently changing the live site."
      - "The operator can preview the proposed diff before applying it."
      - "Accepting the diff applies the intended public-site change and preserves unrelated content."
      - "Rejecting or cancelling the diff leaves the current site unchanged."
      - "Unsupported, ambiguous, unsafe, or out-of-scope edit requests are refused or require clarification."
      - "The Assistant cannot bypass allowed editor fields, tenant boundaries, or publication permissions."
    assumptions:
      - "Issue #66 is closed in the 2026-07-23 PRD intake and is tracked as regression baseline."
      - "Previewable diff remains the QA oracle until Product/Engineering defines more precise pass/fail criteria."
    open_questions:
      - "Which public-site edit operations are in scope for #66: copy, layout, theme, component visibility, ordering, data binding, or publish settings?"
      - "What fields may an AI-generated diff modify?"
      - "Should accepted diffs auto-save draft only, update preview only, or publish immediately after operator confirmation?"
    related_requirements:
      - "REQ-CONSOLE-012"
      - "REQ-THEME-004"
      - "REQ-THEME-005"
      - "REQ-TENANT-001"

  - id: "REQ-ONBOARD-003"
    title: "Console asks first-time users before auto-running onboarding tours"
    description: "After a user's first successful sign-in, the console must ask whether they are new before auto-running per-screen onboarding tours."
    prd_section: "Issue #68 Goal; Issue #68 Example of done"
    source_issues:
      - "#68"
    priority: "should"
    type: "ui"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "On the first authenticated visit per user, a dialog asks whether this is the user's first time in Riffables."
      - "Choosing the new-user option starts tours as before, including the current screen immediately."
      - "Choosing the returning-user option prevents tour auto-start on future visits while preserving manual replay from Help."
      - "Dismissing the dialog without choosing persists no decision and re-offers the prompt on the next visit."
      - "Users who already completed the home tour are grandfathered and are not asked."
      - "The consent behavior applies to desktop tours and the focus-mode editor honors the same choice."
    assumptions:
      - "The user-level decision is tracked in localStorage unless Product/Engineering confirms server-side storage."
    open_questions:
      - "Should onboarding consent be stored only locally, per browser, or server-side per operator account?"
    related_requirements:
      - "REQ-ONBOARD-001"
      - "REQ-ONBOARD-002"

  - id: "REQ-BUILDER-007"
    title: "Operator can choose and retain one of two rendered site templates"
    description: "Starting a site must show exactly two real rendered template previews, and the chosen template must drive the editor schema and remain selected across navigation and reload."
    prd_section: "Issue #75 Mechanic and Acceptance criteria; Issue #77 Goal and Example of done"
    source_issues:
      - "#75"
      - "#77"
    priority: "must"
    type: "functional"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "The start-site surface shows exactly two available templates: the original creator library and the canvas library."
      - "Each template choice is a real rendered preview rather than a name-only or placeholder card."
      - "Choosing either template opens the editor with that template's own sections, fields, and theme."
      - "The selected template persists after leaving, reopening, and refreshing the editor."
      - "A site record cannot silently switch to the other template during save, publish, or reopen."
    assumptions:
      - "Issues #75 and #77 are closed and tracked as regression baseline."
    open_questions: []
    related_requirements:
      - "REQ-BUILDER-005"
      - "REQ-BUILDER-008"

  - id: "REQ-BUILDER-008"
    title: "Editor preview and public site preserve template data, links, and rendering parity"
    description: "The selected template must use real catalog data, expose effective controls, keep editor and public rendering aligned, and route preview links without leaving the editor or producing avoidable 404 pages."
    prd_section: "Issue #75 Acceptance criteria; Issue #79 Goal; Issue #81 Goal and Example of done"
    source_issues:
      - "#75"
      - "#79"
      - "#81"
    priority: "must"
    type: "integration-data-integrity"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "All shipped navigation items and calls-to-action resolve to pages that exist."
      - "Catalog-bound sections render the selected record's values and do not retain shipped placeholder content."
      - "Every inspector control exposed for the template changes the intended canvas output."
      - "A section styled in the editor renders equivalently on the published public site."
      - "In Preview mode, a valid internal link switches the editor to the target site page without leaving the editor."
      - "In Preview mode, a missing internal page does not navigate to a console 404."
      - "External links continue to open normally."
      - "In Edit mode, clicking a link selects the editable section instead of navigating."
    assumptions:
      - "Browser back/forward history for preview navigation is out of scope."
    open_questions:
      - "What visual-diff tolerance is approved for editor versus public rendering parity?"
    related_requirements:
      - "REQ-BUILDER-002"
      - "REQ-BUILDER-007"

  - id: "REQ-BUILDER-009"
    title: "Template supports interactive FAQ entries and per-track podcast links"
    description: "Operators must be able to configure FAQ question-answer pairs and a link for each podcast track, with usable interactions on the published site."
    prd_section: "Issue #80 Goal and Example of done"
    source_issues:
      - "#80"
    priority: "should"
    type: "functional-ui"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "The editor exposes question and answer fields for each FAQ entry."
      - "Published FAQ questions expand their answers when selected."
      - "Only one FAQ answer is open at a time."
      - "Each podcast track exposes its own link field."
      - "A track with a valid link is clickable and opens the configured destination."
      - "A track without a link does not expose a broken or misleading action."
    assumptions:
      - "FAQ entries remain a flat list; nested and reorder behavior is out of scope."
    open_questions:
      - "What validation applies to podcast track URLs?"
    related_requirements:
      - "REQ-BUILDER-008"

  - id: "REQ-BUILDER-010"
    title: "Section styling controls are scoped, pre-filled, and fully labelled"
    description: "Each section must expose the style controls it supports, pre-filled from the rendered value, and changing a control must affect only that section."
    prd_section: "Issue #76 Acceptance criteria; Issue #82 Goal; Issue #83 Goal"
    source_issues:
      - "#76"
      - "#82"
      - "#83"
    priority: "should"
    type: "ui-data-integrity"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "The inspector shows controls for the text roles present in the selected section, including heading, eyebrow, link, number, or body where applicable."
      - "Button background color and button text color are separate controls."
      - "Font size and font weight are adjustable per section."
      - "Each control opens pre-filled with the value currently rendered by that section."
      - "Changing one section does not modify another section or the site-wide theme."
      - "Each control uses its configured human-readable label rather than an implementation-derived abbreviation."
      - "Labels remain fully readable without clipping at supported editor widths."
      - "Color choices are limited to template theme tokens rather than arbitrary values."
    assumptions:
      - "Per-element rich-content overrides are out of scope."
    open_questions:
      - "Which editor widths are officially supported for label-layout assertions?"
    related_requirements:
      - "REQ-BUILDER-008"
      - "REQ-BUILDER-012"

  - id: "REQ-BUILDER-011"
    title: "Operator can choose an uploaded image directly from a section image field"
    description: "A section image field must provide an upload-and-pick control backed by the operator's image asset library instead of requiring manual URL entry."
    prd_section: "Issue #74 scope; Issue #84 Goal and Example of done"
    source_issues:
      - "#74"
      - "#84"
    priority: "should"
    type: "functional-integration"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "Selecting a section with an image field exposes an upload-and-pick control."
      - "The operator can browse or upload supported images without seeing or typing the permanent asset URL."
      - "Choosing an asset updates only the selected section image."
      - "The selected image appears in editor preview and remains associated with the draft after save/reopen."
      - "Canceling the picker or discarding the draft leaves the previous section image unchanged."
      - "The picker lists only images the active operator is allowed to use."
    assumptions:
      - "Full-library labelling, pagination, and removal remain covered by the image asset library requirements."
    open_questions: []
    related_requirements:
      - "REQ-PUBLIC-007"
      - "REQ-PUBLIC-008"
      - "REQ-TENANT-001"

  - id: "REQ-BUILDER-012"
    title: "Builder agent restyles sites only through named template presets and tokens"
    description: "The builder agent must list and apply curated theme presets while refusing free-form styling or values outside the selected template's tokens."
    prd_section: "Issue #75 Locked constants; Issue #78 Goal and Example of done"
    source_issues:
      - "#75"
      - "#78"
    priority: "must"
    type: "ai-assisted-security"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "The agent can list the named theme presets available for the selected template."
      - "Applying a preset changes the site to that preset through a reviewable editor diff."
      - "Only fields and token values defined by the template preset are changed."
      - "A request for arbitrary CSS, unsupported style fields, or non-token values is refused."
      - "Rejecting or discarding a preset diff leaves the current theme unchanged."
      - "Applying a preset to one tenant cannot affect another tenant's site or preset state."
    assumptions:
      - "Operator-authored presets and uploaded stylesheets are out of scope."
    open_questions:
      - "What are the exact preset names for each shipped template?"
    related_requirements:
      - "REQ-BUILDER-006"
      - "REQ-BUILDER-007"
      - "REQ-THEME-004"
      - "REQ-THEME-005"

  - id: "REQ-BUILDER-013"
    title: "Builder assistant composer supports image attachment lifecycle"
    description: "An operator must be able to attach or paste one or more images, preview thumbnails, remove attachments, and send an image with or without text."
    prd_section: "Issue #87 Acceptance criteria; Issue #89 Goal and Example of done"
    source_issues:
      - "#87"
      - "#89"
    priority: "must"
    type: "functional-ui"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "The composer provides an image attachment control."
      - "Selecting one or more supported images shows a thumbnail for each attachment before send."
      - "Pasting an image from the clipboard attaches it through the same lifecycle."
      - "An attachment can be removed before send without deleting the uploaded asset from the operator's library."
      - "A message can be sent with only an image and no text."
      - "After send, the operator message displays the images attached to that turn."
      - "The assistant can use the attached asset URL to place the image in an allowed site section through a reviewable change."
    assumptions:
      - "Audience-facing chat attachments and non-image files are out of scope."
    open_questions: []
    related_requirements:
      - "REQ-BUILDER-006"
      - "REQ-BUILDER-011"
      - "REQ-BUILDER-014"

  - id: "REQ-BUILDER-014"
    title: "Builder image attachments reuse asset validation and complete upload before send"
    description: "Composer attachments must upload into the existing asset library, enforce the same type and size limits, and never be dropped from a sent turn because upload was incomplete."
    prd_section: "Issue #87 Locked constants; Issue #89 Agent instructions"
    source_issues:
      - "#87"
      - "#89"
    priority: "must"
    type: "data-integrity-security"
    status: "regression_baseline_draft"
    acceptance_criteria:
      - "Accepted attachment types are PNG, JPEG, WebP, and GIF."
      - "Each attachment must be no larger than 10 MiB."
      - "Unsupported or oversized files are rejected in the composer with a clear reason and are never uploaded."
      - "Sending is disabled or held while any included attachment is still uploading."
      - "After upload completes, the turn references the permanent asset-library URL and does not create a separate attachment store."
      - "Existing asset deduplication and operator/tenant access controls still apply."
      - "Upload failure leaves the turn unsent or clearly excludes the failed attachment only after explicit operator action."
    assumptions:
      - "The composer reuses the image asset API defined by issue #74."
    open_questions:
      - "What retry/cancel behavior is expected for a failed attachment upload?"
    related_requirements:
      - "REQ-BUILDER-013"
      - "REQ-PUBLIC-007"
      - "REQ-PUBLIC-008"
      - "REQ-TENANT-001"

  - id: "REQ-BUILDER-015"
    title: "Builder agent can inspect attached image content within conversation and tenant boundaries"
    description: "For the V1.1 vision flow, the builder agent must be able to reason about an attached image, act consistently with its contents, and refuse to invent visual observations when the image cannot be read."
    prd_section: "Issue #88 Mechanic, Acceptance criteria, and Locked constants"
    source_issues:
      - "#88"
    priority: "should"
    type: "ai-validation-security"
    status: "needs_confirmation"
    acceptance_criteria:
      - "An answer to a question about an attached image demonstrably reflects controlled visual details from that image."
      - "A requested site change based on an attached reference image is consistent with the approved visual golden fixture."
      - "The agent cannot read an image that was not attached to the current conversation."
      - "The agent cannot read another tenant's image through guessed IDs, URLs, prompts, or tool calls."
      - "Existing image-placement behavior from issue #87 continues to work."
      - "When image content cannot be read, the agent states that limitation and does not fabricate a description."
    assumptions:
      - "Images remain in the existing asset library and are read through a tenant-scoped per-turn capability."
    open_questions:
      - "What API or agent tool transports image bytes to the text-only builder-agent runtime?"
      - "What response field, tool log, or trace proves that the model read the attachment?"
      - "Which model and deterministic visual fixture set should QA use for repeatable evaluation?"
    related_requirements:
      - "REQ-BUILDER-013"
      - "REQ-BUILDER-014"
      - "REQ-TENANT-001"
      - "REQ-TENANT-002"

  - id: "REQ-ONBOARD-004"
    title: "New tenant receives a data-driven getting-started checklist on Home"
    description: "A new tenant with zero sources must receive a non-blocking three-step checklist driven by real source, crawl/riff, and site state, with dismissal stored per operator and tenant."
    prd_section: "Issue #85 Acceptance criteria and Locked constants; Issue #86 Goal and Example of done"
    source_issues:
      - "#85"
      - "#86"
    priority: "should"
    type: "functional-ui-data-integrity"
    status: "draft"
    acceptance_criteria:
      - "A tenant with zero sources sees the checklist auto-open on Home."
      - "The checklist orders the steps as Connect a source, Turn videos into riffs, and Edit your site, with the current step clearly identified."
      - "Each step derives completion from the active tenant's real data rather than from clicking its action."
      - "A queued crawl satisfies the second step immediately through lastRunAt or equivalent state; the user does not wait for a ready riff."
      - "Each step routes to the existing Sources, video selection/crawl, or site editor workflow."
      - "The operator can dismiss and reopen the checklist."
      - "After all three steps are complete, the checklist no longer auto-opens."
      - "Dismissal is stored per operator and per tenant, so another empty tenant remains eligible."
      - "Checklist dismissal/completion does not change screen-tour consent, seen state, or replay behavior."
      - "The checklist reuses the existing Home snapshot and does not introduce a new polling loop."
    assumptions:
      - "A source exists, Source.lastRunAt or any riff exists, and a site exists are the three completion signals."
    open_questions:
      - "What exact control reopens a dismissed checklist on Home?"
    related_requirements:
      - "REQ-CONSOLE-002"
      - "REQ-ONBOARD-001"
      - "REQ-ONBOARD-003"

